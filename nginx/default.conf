server {
    listen 80 default_server;
    server_name www.modaurbana.test;

    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    absolute_redirect off;

    error_page 404 /404.html;
    location = /404.html { internal; }

    location = /catalogo        { return 301 /tienda; }
    location = /tienda          { return 301 /productos-viejo; }
    location = /productos-viejo { return 301 /productos/; }
    location = /rebajas         { return 302 /ofertas/; }

    location = /favicon.ico { access_log off; return 204; }

    location / {
        try_files $uri $uri/ =404;
    }
}
